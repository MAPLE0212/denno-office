; M5Stack StopWatch (C152)
; ファームのソースは firmware/ にある（このファイルはリポジトリ直下に置き、VS Code の PlatformIO からそのまま書き込めるようにしている）
[platformio]
src_dir = firmware

; 公式ドキュメント (https://docs.m5stack.com/en/products/sku/C152) の
; [env:m5stack-stopwatch] に合わせた設定。ビルドが通らない場合は公式のブロックと見比べてください。
[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/m5stack/M5Unified
  https://github.com/m5stack/M5GFX
  https://github.com/m5stack/M5PM1
  https://github.com/m5stack/M5IOE1
