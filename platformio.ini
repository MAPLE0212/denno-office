; M5Stack StopWatch (C152) と M5Dial
; ファームのソースは firmware/ にある（このファイルはリポジトリ直下に置き、VS Code の PlatformIO からそのまま書き込めるようにしている）
[platformio]
src_dir = firmware
; 何も指定しないときは StopWatch 用を作る（Dial 用は -e m5stack-dial）
default_envs = m5stack-stopwatch

; 公式ドキュメント (https://docs.m5stack.com/en/products/sku/C152) の
; [env:m5stack-stopwatch] に合わせた設定。ビルドが通らない場合は公式のブロックと見比べてください。
[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
; Dial 用（firmware/dial/）は入れない
build_src_filter = +<*> -<dial/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/m5stack/M5Unified
  https://github.com/m5stack/M5GFX
  https://github.com/m5stack/M5PM1
  https://github.com/m5stack/M5IOE1

; M5Stack M5Dial（中身は StampS3：ESP32-S3FN8、フラッシュ 8MB、PSRAM なし、1.28" 丸 240x240）
; ソースは firmware/dial/ だけ（StopWatch 用の firmware/main.cpp とは別のプログラム。Wi-Fi の設定 denno_config.h は共通）
; 書き込み: pio run -e m5stack-dial -t upload
[env:m5stack-dial]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = firmware/dial/partitions_dial.csv
build_src_filter = +<dial/>
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  https://github.com/m5stack/M5Unified
  https://github.com/m5stack/M5GFX
